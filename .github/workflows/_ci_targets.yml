# Reusable CI: четыре целевые сборки.
# WinForms x86/x64 и MAUI Windows x64 — NSIS-инсталляторы (как в _build.yml).
# Android arm64 — APK.
#
# Android signing (always; unsigned APKs will not install):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, ANDROID_KEYSTORE_PASSWORD
# Without secrets → scripts/android/ci-debug.keystore (installable CI debug key).

name: CI targets (reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration: Release или Debug'
        required: false
        type: string
        default: 'Release'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  winforms-x86:
    name: WinForms win-x86
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: .\scripts\nsis_winforms_x86.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: winforms-x86-${{ inputs.configuration }}
          path: dist/installers/TorgLink-*-winforms-x86-setup.exe
          if-no-files-found: error

  winforms-x64:
    name: WinForms win-x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: .\scripts\nsis_winforms_x64.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: winforms-x64-${{ inputs.configuration }}
          path: dist/installers/TorgLink-*-winforms-x64-setup.exe
          if-no-files-found: error

  maui-windows-x64:
    name: MAUI Windows win-x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        # Win10+ unpackaged self-contained + NSIS (scripts/nsis_win_10_x64.ps1 → dist/installers)
        run: .\scripts\nsis_win_10_x64.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: maui-windows-x64-${{ inputs.configuration }}
          path: dist/installers/TorgLink-*-win10-x64-setup.exe
          if-no-files-found: error

  android-arm64:
    name: Android android-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Publish APK (android-arm64)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/ci/publish-android-apk.sh android-arm64 ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-android-arm64-${{ inputs.configuration }}
          path: dist/apk/TorgLink-android-arm64.apk
          if-no-files-found: error
