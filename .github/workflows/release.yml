name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  winforms:
    name: WinForms NSIS (x86 32-bit / x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installers
        run: |
          .\scripts\nsis_winforms_x32.ps1
          .\scripts\nsis_winforms_x64.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: winforms
          path: dist/installers/Iskra-*-winforms-*-setup.exe
          if-no-files-found: error

  maui-windows:
    name: MAUI Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installers
        run: |
          .\scripts\nsis_win_10_x64.ps1
          .\scripts\nsis_win_11_x64.ps1
          .\scripts\nsis_win_10_x32.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: maui-windows
          path: dist/installers/Iskra-*-win*-setup.exe
          if-no-files-found: error

  android:
    name: Android APK (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-arm, android-x64, android-x86]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret; skipping decode (unsigned APK)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iskra.keystore"

      - name: Publish APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            extra+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/iskra.keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
            )
          else
            echo "Signing secrets incomplete; publishing unsigned APK."
          fi
          dotnet publish src/Iskra.Maui/Iskra.Maui.csproj \
            -c Release \
            -f net10.0-android \
            -p:IncludeAndroid=true \
            -p:RuntimeIdentifier=${{ matrix.rid }} \
            -p:AndroidPackageFormat=apk \
            "${extra[@]}"
          mkdir -p dist/apk
          mapfile -t apks < <(find src/Iskra.Maui/bin -type f -name '*.apk' ! -name '*-unsigned.apk')
          if [ ${#apks[@]} -eq 0 ]; then
            mapfile -t apks < <(find src/Iskra.Maui/bin -type f -name '*.apk')
          fi
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          cp "${apks[0]}" "dist/apk/Iskra-${{ matrix.rid }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.rid }}
          path: dist/apk/Iskra-${{ matrix.rid }}.apk
          if-no-files-found: error

  publish-release:
    name: GitHub Release
    needs: [winforms, maui-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
