name: Build (reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration: Release или Debug'
        required: false
        type: string
        default: 'Release'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  winforms:
    name: WinForms NSIS (x86 32-bit / x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installers
        run: |
          .\scripts\nsis_winforms_x32.ps1 -Configuration ${{ inputs.configuration }}
          .\scripts\nsis_winforms_x64.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: winforms-${{ inputs.configuration }}
          path: dist/installers/Iskra-*-winforms-*-setup.exe
          if-no-files-found: error

  maui-windows:
    name: MAUI Windows NSIS (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [win_10_x32, win_10_x64, win_10_arm64, win_11_x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: .\scripts\nsis_${{ matrix.target }}.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: maui-windows-${{ matrix.target }}-${{ inputs.configuration }}
          path: dist/installers/Iskra-*-setup.exe
          if-no-files-found: error

  android:
    name: Android APK (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-arm, android-x64, android-x86]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode keystore
        if: inputs.configuration == 'Release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret; skipping decode (unsigned APK)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iskra.keystore"

      - name: Publish APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ inputs.configuration }}" = "Release" ] && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            extra+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/iskra.keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
            )
          else
            echo "Debug configuration or signing secrets incomplete; publishing without release signing."
          fi
          # EnableWindowsTargeting: restore вычисляет все TFM Iskra.Maui, и для windows-TFM
          # в граф попадает ShortP2P.Transport.Bluetooth.Windows (net10.0-windows). На Linux
          # его restore без этого флага падает с NETSDK1100. Проект только restore-ится,
          # в сборку android-TFM он не входит (ProjectReference с условием на windows).
          dotnet publish src/Iskra.Maui/Iskra.Maui.csproj \
            -c ${{ inputs.configuration }} \
            -f net10.0-android \
            -p:IncludeAndroid=true \
            -p:EnableWindowsTargeting=true \
            -p:RuntimeIdentifier=${{ matrix.rid }} \
            -p:AndroidPackageFormat=apk \
            "${extra[@]}"
          mkdir -p dist/apk
          mapfile -t apks < <(find src/Iskra.Maui/bin -type f -name '*.apk' ! -name '*-unsigned.apk')
          if [ ${#apks[@]} -eq 0 ]; then
            mapfile -t apks < <(find src/Iskra.Maui/bin -type f -name '*.apk')
          fi
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          cp "${apks[0]}" "dist/apk/Iskra-${{ matrix.rid }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.rid }}-${{ inputs.configuration }}
          path: dist/apk/Iskra-${{ matrix.rid }}.apk
          if-no-files-found: error

  web:
    name: Web (Iskra.Web.Api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Web API
        run: |
          set -euo pipefail
          ver=$(grep -oPm1 '(?<=<ApplicationDisplayVersion>)[^<]+' src/Iskra.Maui/Iskra.Maui.csproj)
          dotnet publish src/Iskra.Web.Api/Iskra.Web.Api.csproj -c ${{ inputs.configuration }} -o dist/web
          cd dist/web
          zip -r "../Iskra-${ver}-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.configuration }}
          path: dist/Iskra-*-web.zip
          if-no-files-found: error
