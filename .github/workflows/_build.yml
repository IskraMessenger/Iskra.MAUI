name: Build (reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration: Release или Debug'
        required: false
        type: string
        default: 'Release'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  winforms:
    name: WinForms NSIS (x86 32-bit / x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installers
        run: |
          .\scripts\nsis_winforms_x32.ps1 -Configuration ${{ inputs.configuration }}
          .\scripts\nsis_winforms_x64.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: winforms-${{ inputs.configuration }}
          path: dist/installers/TorgLink-*-winforms-*-setup.exe
          if-no-files-found: error

  maui-windows:
    name: MAUI Windows NSIS (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [win_10_x32, win_10_x64, win_10_arm64, win_11_x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: .\scripts\nsis_${{ matrix.target }}.ps1 -Configuration ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: maui-windows-${{ matrix.target }}-${{ inputs.configuration }}
          path: dist/installers/TorgLink-*-setup.exe
          if-no-files-found: error

  android:
    name: Android APK (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-arm, android-x64, android-x86]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Publish APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/ci/publish-android-apk.sh ${{ matrix.rid }} ${{ inputs.configuration }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.rid }}-${{ inputs.configuration }}
          path: dist/apk/TorgLink-${{ matrix.rid }}.apk
          if-no-files-found: error

  web:
    name: Web (TorgLink.Web.Api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Web API
        run: |
          set -euo pipefail
          ver=$(grep -oPm1 '(?<=<ApplicationDisplayVersion>)[^<]+' src/TorgLink.Maui/TorgLink.Maui.csproj)
          dotnet publish src/TorgLink.Web.Api/TorgLink.Web.Api.csproj -c ${{ inputs.configuration }} -o dist/web
          cd dist/web
          zip -r "../TorgLink-${ver}-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.configuration }}
          path: dist/TorgLink-*-web.zip
          if-no-files-found: error
