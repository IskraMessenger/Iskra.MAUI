name: Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег пререлиза, например v0.1.8-beta (будет создан на коммите выбранной ветки)'
        required: true
        type: string

jobs:
  build:
    name: Build all (Release)
    uses: ./.github/workflows/_build.yml
    with:
      configuration: Release
    secrets: inherit

  publish-prerelease:
    name: GitHub Prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: true
          files: artifacts/**
          generate_release_notes: true
